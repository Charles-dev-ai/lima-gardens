.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs button{background:#e6ece2}.tabs button.on{background:#2d5a3f;color:#fff}

#login{max-width:400px;margin:70px auto}small{color:#4a5d51}
</style></head><body>

<main><div class="tabs" id="tabs"></div><div id="pane"></div></main></div>

<script>
(function(){var $=function(i){return document.getElementById(i)},pw="",cfg,tab="Menu",dirty=false;
var TABS=["Menu","Slides","Tiles","Rooms","Waiters","Events","Tables","Site"];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function call(url,opt){return fetch(url,opt).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){}return{ok:r.ok,status:r.status,j:j}})})}
function diagnose(){return call("/api/login").then(function(r){var m;
if(r.status===404||r.status===405&&!r.j.passwordSet&&r.j.error===undefined&&!("dbSet" in r.j))m="The server code is not deployed (/api/login was not found). Make sure the api folder with config.js, login.js and _lib.js is in your project, then redeploy.";
else if(!r.j.passwordSet)m="ADMIN_PASSWORD is not set. In Vercel go to Settings > Environment Variables, add it, then redeploy.";
else if(!r.j.dbSet)m="Password is set, but no database is connected. Add Upstash Redis under Storage and connect it to this project, then redeploy. You can still sign in, but saving will fail.";
else m="Server is configured. If sign-in fails, the password is wrong.";$("diag").innerHTML="<small><b>Setup check:</b> "+m+"</small>"}).catch(function(){$("diag").innerHTML="<small>Could not reach the server.</small>"})}
function get(p){return p.split(".").reduce(function(o,k){return o[k]},cfg)}
function set(p,v){var k=p.split("."),l=k.pop();k.reduce(function(o,x){return o[x]},cfg)[l]=v;dirty=true;$("status").textContent="Unsaved changes";$("status").className=""}
function inp(p,l,type){return'<label>'+l+'<input data-p="'+p+'" '+(type?'type="'+type+'"':"")+' value="'+esc(get(p))+'"></label>'}
function shrink(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(800,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);cb(c.toDataURL("image/jpeg",.6))};im.src=r.result};r.readAsDataURL(f)}
function photo(p){var v=get(p);return'<div class="r">'+(v?'<img src="'+v+'" style="flex:0 0 90px;height:60px;object-fit:cover;border-radius:8px">':"")+'<label style="margin:0">Photo<input type="file" accept="image/*" data-up="'+p+'"></label>'+(v?'<button class="x" data-clr="'+p+'">Remove photo</button>':"")+'</div>'}
function ev(){return cfg.site.events}
function render(){$("tabs").innerHTML=TABS.map(function(t){return'<button class="'+(t===tab?"on":"")+'" data-t="'+t+'">'+t+'</button>'}).join("");var h="";
if(tab==="Waiters"){h='<div class="card"><h3>Waiters</h3><small>Customers pick a waiter by name; WhatsApp opens to that number. Use international format, e.g. 254715066812.</small>'+cfg.waiters.map(function(w,i){return'<div class="r"><input data-p="waiters.'+i+'.name" value="'+esc(w.name)+'" placeholder="Name"><input data-p="waiters.'+i+'.phone" value="'+esc(w.phone)+'" placeholder="2547..."><button class="x" data-del="waiters:'+i+'">Remove</button></div>'}).join("")+'<button data-add="waiter">Add waiter</button></div>'}
if(tab==="Tables")h='<div class="card"><h3>Tables</h3><label>Table names, separated by commas<textarea id="tb" rows="3">'+esc(cfg.tables.join(", "))+'</textarea></label><small>Example: 1, 2, 3, Patio 1, VIP</small></div>';
if(tab==="Menu")h='<div class="card"><h3>Menu, drinks and prices</h3><small>Change any name or price. Use Add item inside a category to add food or drinks. Tick Info only for charges that should not be orderable.</small><br><br><button data-add="cat">Add new category</button></div>'+cfg.menu.map(function(m,c){return'<div class="card"><div class="r"><input data-p="menu.'+c+'.title" value="'+esc(m.title)+'"><button class="x" data-del="menu:'+c+'">Delete category</button></div>'+photo("menu."+c+".photo")+'<button class="g" data-add="item:'+c+'">Add item</button>'+m.items.map(function(it,i){return'<div class="r"><input data-p="menu.'+c+'.items.'+i+'.0" value="'+esc(it[0])+'"><input class="s" type="number" data-n="1" data-p="menu.'+c+'.items.'+i+'.1" value="'+it[1]+'"><label class="s" style="font-weight:400;display:flex;gap:4px"><input type="checkbox" style="width:auto" data-ck="menu.'+c+'.items.'+i+'.2" '+(it[2]?"checked":"")+'>Info only</label><button class="x" data-del="item:'+c+':'+i+'">x</button></div>'}).join("")+'</div>'}).join("");
if(tab==="Slides")h='<div class="card"><h3>Home slideshow</h3><small>Add a real photo to each slide. Without one, a built-in picture is used. Photos are shrunk automatically.</small></div>'+cfg.site.slides.map(function(s,i){var p="site.slides."+i;return'<div class="card">'+inp(p+".title","Headline")+'<label>Text<textarea rows="2" data-p="'+p+'.text">'+esc(s.text)+'</textarea></label>'+inp(p+".cta","Button text")+'<label>Button does<select data-p="'+p+'.action">'+cfg.menu.map(function(m){return'<option value="menu:'+m.id+'" '+(s.action==="menu:"+m.id?"selected":"")+'>Open menu: '+esc(m.title)+'</option>'}).join("")+['book:Accommodation|Book a room','book:Table reservation|Reserve a table','book:Event or party|Plan an event','#events|Show events','call|Call the restaurant'].map(function(o){o=o.split("|");return'<option value="'+o[0]+'" '+(s.action===o[0]?"selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></label>'+photo(p+".photo")+'<button class="x" data-del="slide:'+i+'">Remove slide</button></div>'}).join("")+'<button data-add="slide">Add slide</button>';
if(tab==="Tiles")h='<div class="card"><h3>Everything in one place</h3><small>The picture tiles on the home page. Add a photo to each.</small></div>'+cfg.site.tiles.map(function(s,i){var p="site.tiles."+i;return'<div class="card"><div class="two">'+inp(p+".title","Title")+inp(p+".go","Button label")+'</div>'+inp(p+".text","Short text")+'<div class="two"><label>Booking goes to<select data-p="'+p+'.service">'+["Table reservation","Meeting space","Event or party","Accommodation","Spa","Barbershop","Car wash","Live music enquiry"].map(function(o){return'<option '+(s.service===o?"selected":"")+'>'+o+'</option>'}).join("")+'</select></label><label>Size<select data-p="'+p+'.size"><option value="" '+(s.size==="big"?"":"selected")+'>Normal</option><option value="big" '+(s.size==="big"?"selected":"")+'>Large</option></select></label></div>'+photo(p+".photo")+'<button class="x" data-del="tile:'+i+'">Remove tile</button></div>'}).join("")+'<button data-add="tile">Add tile</button>';
if(tab==="Rooms")h='<div class="card"><h3>Rooms</h3></div>'+cfg.site.rooms.map(function(r,i){var p="site.rooms."+i;return'<div class="card"><div class="two">'+inp(p+".name","Room name")+inp(p+".price","Price (e.g. KES 2,500 per night)")+'</div><label>Details<textarea rows="2" data-p="'+p+'.text">'+esc(r.text)+'</textarea></label>'+photo(p+".photo")+'<button class="x" data-del="room:'+i+'">Remove room</button></div>'}).join("")+'<button data-add="room">Add room</button>';
if(tab==="Events")h='<div class="card"><h3>Events and live music</h3><small>Leave the date empty for something that happens every week.</small>'+ev().map(function(e,i){var p="site.events."+i;return'<div class="card" style="background:#f7faf4"><div class="two">'+inp(p+".title","Title")+inp(p+".date","Date","date")+inp(p+".tag","Label (Live music, Meetings...)")+'</div><label>Details<textarea rows="2" data-p="'+p+'.text">'+esc(e.text)+'</textarea></label><button class="x" data-del="ev:'+i+'">Remove event</button></div>'}).join("")+'<button data-add="ev">Add event</button></div>';
if(tab==="Site")h='<div class="card"><h3>Contacts and site text</h3>'+inp("restaurantPhone","Restaurant WhatsApp number (e.g. 254750438215)")+inp("site.tagline","Main headline")+'<label>About us<textarea rows="4" data-p="site.about">'+esc(cfg.site.about)+'</textarea></label>'+inp("site.address","Address or directions")+'<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" data-ck="site.open24" '+(cfg.site.open24!==0&&cfg.site.open24!==false?"checked":"")+'>Open 24 hours, every day</label><small>If unticked, set hours below.</small>'+inp("site.open","Opens (24h, e.g. 08:00)")+inp("site.close","Closes (e.g. 22:00)")+inp("site.facebook","Facebook page link")+inp("site.tiktok","TikTok link")+inp("site.instagram","Instagram link (optional)")+'</div>';
$("pane").innerHTML=h}
$("tabs").onclick=function(e){var b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;render()}};
$("pane").oninput=function(e){var t=e.target;if(t.id==="tb"){cfg.tables=t.value.split(",").map(function(x){return x.trim()}).filter(Boolean);set("tables",cfg.tables);return}
if(t.dataset.p)set(t.dataset.p,t.dataset.n?+t.value||0:t.value);if(t.dataset.ck)set(t.dataset.ck,t.checked?1:0)};
$("pane").onchange=function(e){var t=e.target;if(t.dataset.up&&t.files[0])shrink(t.files[0],function(d){set(t.dataset.up,d);render()})};
$("pane").onclick=function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.add,d=b.dataset.del;
if(a==="tile")cfg.site.tiles.push({title:"New service",text:"",art:"garden",service:"Table reservation",size:"",go:"Book now"});if(a==="slide")cfg.site.slides.push({title:"New slide",text:"",cta:"Order now",action:"menu:main",art:"garden"});if(a==="room")cfg.site.rooms.push({name:"New room",price:"Ask for rate",text:"",photo:""});if(a==="waiter")cfg.waiters.push({name:"",phone:""});if(a==="cat")cfg.menu.push({id:"c"+Date.now(),title:"New category",items:[]});if(a&&a.indexOf("item:")===0)cfg.menu[+a.split(":")[1]].items.push(["New item",0]);if(a==="ev")ev().push({date:"",title:"New event",text:"",tag:"Event"});
if(d){var p=d.split(":"),n=+p[1];if(!confirm("Remove this?"))return;if(p[0]==="waiters")cfg.waiters.splice(n,1);if(p[0]==="menu")cfg.menu.splice(n,1);if(p[0]==="item")cfg.menu[n].items.splice(+p[2],1);if(p[0]==="ev")ev().splice(n,1);if(p[0]==="tile")cfg.site.tiles.splice(n,1);if(p[0]==="slide")cfg.site.slides.splice(n,1);if(p[0]==="room")cfg.site.rooms.splice(n,1)}
if(b.dataset.clr){set(b.dataset.clr,"");render()}
if(a||d){dirty=true;$("status").textContent="Unsaved changes";render()}};
function start(){return call("/api/config?_="+Date.now()).then(function(r){var c=r.j.config||{};cfg=JSON.parse(JSON.stringify(DEFAULTS));
Object.keys(c).forEach(function(k){if(k!=="site")cfg[k]=c[k]});cfg.site=Object.assign({},DEFAULTS.site,c.site||{});if(!Array.isArray(cfg.site.events))cfg.site.events=[];
$("login").hidden=true;$("app").hidden=false;render()})}
$("lf").onsubmit=function(e){e.preventDefault();var le=$("le");le.hidden=true;$("lb").disabled=true;
call("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})}).then(function(r){
if(!r.ok)throw new Error(r.j.error||(r.status===404?"Server code not found (/api/login returned 404).":"Could not sign in (error "+r.status+")."));
pw=$("pw").value;try{sessionStorage.setItem("lima-admin",pw)}catch(x){}return start()}).catch(function(x){le.textContent=x.message;le.hidden=false;diagnose()}).then(function(){$("lb").disabled=false})};
$("save").onclick=function(){var body=JSON.stringify(cfg);if(body.length>950000){$("status").textContent="Too many large photos ("+Math.round(body.length/1000)+" KB). Remove a few photos and try again.";$("status").className="bad";return}
$("status").textContent="Saving...";call("/api/config",{method:"PUT",headers:{"Content-Type":"application/json","x-admin-password":pw},body:body}).then(function(r){
if(!r.ok)throw new Error(r.j.error||"Save failed ("+r.status+")");dirty=false;$("status").textContent="Saved. Live within 10 seconds.";$("status").className="ok"}).catch(function(x){$("status").textContent=x.message;$("status").className="bad"})};
$("out").onclick=function(){try{sessionStorage.removeItem("lima-admin")}catch(x){}location.reload()};
window.onbeforeunload=function(){return dirty?"Unsaved changes":undefined};
diagnose();var saved;try{saved=sessionStorage.getItem("lima-admin")}catch(x){}
if(saved){pw=saved;call("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:saved})}).then(function(r){if(r.ok)start()})}})();
</script></body></html>
